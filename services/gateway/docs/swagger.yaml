basePath: /api/v1
definitions:
  request.BatchDeleteWorkspaceFilesRequest:
    properties:
      file_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - file_ids
    type: object
  request.ChangeEmailRequest:
    properties:
      new_email:
        example: newuser@example.com
        type: string
      password:
        example: "123456"
        minLength: 6
        type: string
    required:
    - new_email
    - password
    type: object
  request.ChangePasswordRequest:
    properties:
      new_password:
        example: "654321"
        minLength: 6
        type: string
      old_password:
        example: "123456"
        minLength: 6
        type: string
    required:
    - new_password
    - old_password
    type: object
  request.CompleteWorkspaceUploadRequest:
    properties:
      file_name:
        maxLength: 255
        type: string
      folder_id:
        type: string
      object_key:
        maxLength: 1024
        type: string
    required:
    - file_name
    - object_key
    type: object
  request.CreateDocumentRequest:
    properties:
      content_json:
        additionalProperties: {}
        type: object
      folder_id:
        type: string
      tiptap_schema:
        type: string
      tiptap_schema_ver:
        type: string
      title:
        maxLength: 255
        type: string
      workspace_id:
        type: string
    required:
    - title
    - workspace_id
    type: object
  request.CreateFolderRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 255
        type: string
      parent_id:
        type: string
    required:
    - name
    type: object
  request.CreateWorkspaceInvitationRequest:
    properties:
      invitee_email:
        type: string
      invitee_user_id:
        type: string
      role:
        enum:
        - admin
        - editor
        - viewer
        type: string
    required:
    - role
    type: object
  request.CreateWorkspaceRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 255
        type: string
      public:
        type: boolean
    required:
    - name
    type: object
  request.ForgotPasswordRequest:
    properties:
      email:
        example: user@example.com
        type: string
    required:
    - email
    type: object
  request.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: "123456"
        type: string
    required:
    - email
    - password
    type: object
  request.LogoutRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  request.PresignWorkspaceUploadRequest:
    properties:
      content_type:
        maxLength: 255
        type: string
      expires_in:
        maximum: 3600
        minimum: 60
        type: integer
      file_name:
        maxLength: 255
        type: string
      folder_id:
        type: string
    required:
    - file_name
    type: object
  request.RefreshTokenRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - refresh_token
    type: object
  request.RegisterRequest:
    properties:
      display_name:
        example: deepwrite-user
        type: string
      email:
        example: user@example.com
        type: string
      password:
        example: "123456"
        minLength: 6
        type: string
    required:
    - display_name
    - email
    - password
    type: object
  request.ResetPasswordRequest:
    properties:
      new_password:
        example: "654321"
        minLength: 6
        type: string
      token:
        example: f2b412f7f05f4d199f8b7a6d577d4b2a
        type: string
    required:
    - new_password
    - token
    type: object
  request.ResolveWorkspaceInvitationRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  request.RestoreDocumentVersionRequest:
    properties:
      version:
        minimum: 1
        type: integer
    required:
    - version
    type: object
  request.SaveDocumentVersionRequest:
    properties:
      content_json:
        additionalProperties: {}
        type: object
      snapshot:
        type: boolean
      source:
        type: string
      summary:
        type: string
      title:
        type: string
    type: object
  request.SyncCollabContentRequest:
    properties:
      content_json:
        additionalProperties: {}
        type: object
      title:
        type: string
    required:
    - content_json
    type: object
  request.UpdateFolderRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 255
        type: string
    type: object
  request.UpdateWorkspaceRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 255
        type: string
      public:
        type: boolean
      status:
        enum:
        - active
        - archived
        type: string
    type: object
  request.UserProfileRequest:
    properties:
      avatar_url:
        example: https://example.com/avatar.jpg
        type: string
      bio:
        example: This is a user bio.
        maxLength: 255
        type: string
      display_name:
        example: deepwrite-user
        maxLength: 30
        type: string
      language:
        example: en
        type: string
      timezone:
        example: UTC
        type: string
    required:
    - avatar_url
    - bio
    - display_name
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      time:
        type: integer
    type: object
  user.Profile:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      display_name:
        type: string
      id:
        type: string
      language:
        type: string
      timezone:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  user.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_login:
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
      user_profile:
        $ref: '#/definitions/user.Profile'
    type: object
host: localhost:8080
info:
  contact: {}
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: DeepWrite Gateway API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用邮箱和密码登录，获取访问令牌和刷新令牌
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 认证失败
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 用户被禁用
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: 主动使当前访问令牌失效；可选传入刷新令牌并一并失效
      parameters:
      - description: 登出信息（可选刷新令牌）
        in: body
        name: request
        schema:
          $ref: '#/definitions/request.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 认证失败
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - Auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: 根据访问令牌返回当前登录用户的基础信息
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取当前用户信息
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用刷新令牌获取新的访问令牌和刷新令牌
      parameters:
      - description: 刷新令牌信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 认证失败
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 用户被禁用
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 刷新令牌
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 注册一个新用户
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 注册成功
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户注册
      tags:
      - Auth
  /documents:
    get:
      consumes:
      - application/json
      description: 按工作区获取文档列表
      parameters:
      - description: 工作区ID
        in: query
        name: workspace_id
        required: true
        type: string
      - description: 分页大小
        in: query
        name: limit
        type: integer
      - description: 偏移量
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 文档列表
      tags:
      - Document
    post:
      consumes:
      - application/json
      description: 创建一个新的文档并写入初始快照版本
      parameters:
      - description: 文档创建参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.CreateDocumentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 创建文档
      tags:
      - Document
  /documents/{id}:
    get:
      consumes:
      - application/json
      description: 根据文档ID获取文档详情
      parameters:
      - description: 文档ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 文档不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取文档详情
      tags:
      - Document
    put:
      consumes:
      - application/json
      description: 保存当前文档内容为新版本，可选择是否标记为快照
      parameters:
      - description: 文档ID
        in: path
        name: id
        required: true
        type: string
      - description: 版本保存参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.SaveDocumentVersionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 保存成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 文档不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 保存文档版本
      tags:
      - Document
  /documents/{id}/collab-token:
    post:
      consumes:
      - application/json
      description: 为当前用户签发一个短期单次使用的协作连接令牌
      parameters:
      - description: 文档ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 签发成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 文档不存在
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 签发协作令牌
      tags:
      - Document
  /documents/{id}/collab/content:
    post:
      consumes:
      - application/json
      description: 客户端定期将当前编辑器 JSON 同步到 documents.content_json
      parameters:
      - description: 文档ID
        in: path
        name: id
        required: true
        type: string
      - description: 内容同步参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.SyncCollabContentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 同步成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 同步协作落地内容
      tags:
      - Document
  /documents/{id}/restore:
    post:
      consumes:
      - application/json
      description: 从历史版本恢复文档，并生成新的快照版本
      parameters:
      - description: 文档ID
        in: path
        name: id
        required: true
        type: string
      - description: 恢复参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.RestoreDocumentVersionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 恢复成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 版本不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 恢复历史版本
      tags:
      - Document
  /documents/{id}/versions:
    get:
      consumes:
      - application/json
      description: 获取文档历史版本列表（按版本号倒序）
      parameters:
      - description: 文档ID
        in: path
        name: id
        required: true
        type: string
      - description: 分页大小
        in: query
        name: limit
        type: integer
      - description: 偏移量
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取文档历史版本
      tags:
      - Document
  /invitations/{invite_id}/accept:
    post:
      consumes:
      - application/json
      description: 当前用户通过 token 接受邀请并加入工作区
      parameters:
      - description: 邀请ID
        in: path
        name: invite_id
        required: true
        type: string
      - description: 接受参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ResolveWorkspaceInvitationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 接受成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 无权限操作
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 邀请不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 接受邀请
      tags:
      - Workspace
  /invitations/{invite_id}/reject:
    post:
      consumes:
      - application/json
      description: 当前用户通过 token 拒绝邀请
      parameters:
      - description: 邀请ID
        in: path
        name: invite_id
        required: true
        type: string
      - description: 拒绝参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ResolveWorkspaceInvitationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 拒绝成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 无权限操作
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 邀请不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 拒绝邀请
      tags:
      - Workspace
  /invitations/me:
    get:
      consumes:
      - application/json
      description: 获取当前用户收到的邀请列表
      parameters:
      - description: 邀请状态
        in: query
        name: status
        type: string
      - description: 分页大小
        in: query
        name: limit
        type: integer
      - description: 偏移量
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 我的邀请列表
      tags:
      - Workspace
  /user/avatar:
    post:
      consumes:
      - multipart/form-data
      description: 上传当前登录用户头像并自动更新用户资料中的 avatar_url
      parameters:
      - description: 头像文件（支持 image/*）
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 上传成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 上传用户头像
      tags:
      - User
  /user/change-email:
    post:
      consumes:
      - application/json
      description: 当前登录用户修改邮箱（需校验密码）
      parameters:
      - description: 修改邮箱请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ChangeEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 邮箱修改成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权或密码错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 修改邮箱
      tags:
      - User
  /user/change-password:
    post:
      consumes:
      - application/json
      description: 修改当前登录用户的密码
      parameters:
