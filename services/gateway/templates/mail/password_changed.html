{{define "content"}}
<p style="margin:0 0 12px 0;font-size:15px;line-height:1.75;color:#374151;">你好，{{.Name}}：</p>
<p style="margin:0 0 12px 0;font-size:15px;line-height:1.75;color:#374151;">你的账号密码已成功修改。</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 14px 0;background-color:#fff7ed;border:1px solid #fdba74;border-radius:10px;">
  <tr>
    <td style="padding:12px 14px;font-size:13px;line-height:1.7;color:#9a3412;">
      修改时间：{{.ChangedAt}}<br />
      IP 地址：{{.IP}}<br />
      设备信息：{{.UserAgent}}
    </td>
  </tr>
</table>

<p style="margin:0 0 12px 0;font-size:13px;line-height:1.7;color:#6b7280;">如果这不是你本人操作，请立即重置密码并联系管理员。</p>
{{if .SecurityURL}}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0;">
  <tr>
    <td style="border-radius:10px;background-color:#111827;">
      <a href="{{.SecurityURL}}" style="display:inline-block;padding:11px 20px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">前往安全中心</a>
    </td>
  </tr>
</table>
{{end}}
{{end}}
