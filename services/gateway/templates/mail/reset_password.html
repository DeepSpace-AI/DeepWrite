{{define "content"}}
<p style="margin:0 0 12px 0;font-size:15px;line-height:1.75;color:#374151;">你好，{{.Name}}：</p>
<p style="margin:0 0 14px 0;font-size:15px;line-height:1.75;color:#374151;">我们收到了你的密码重置请求。请点击下方按钮设置新密码。</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 14px 0;">
  <tr>
    <td style="border-radius:10px;background-color:#2563eb;">
      <a href="{{.ResetURL}}" style="display:inline-block;padding:11px 20px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">重置密码</a>
    </td>
  </tr>
</table>

<p style="margin:0 0 8px 0;font-size:13px;line-height:1.7;color:#6b7280;">此链接将在 {{.ExpireMinutes}} 分钟后失效。</p>
<p style="margin:0;font-size:13px;line-height:1.7;color:#6b7280;">若按钮无法点击，请复制链接到浏览器打开：{{.ResetURL}}</p>
{{end}}
