<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827;">
    <div style="display:none;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">
      {{if .Preheader}}{{.Preheader}}{{else}}你有一封来自 {{.Brand}} 的新通知，请及时查看。{{end}}
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:640px;">
            <tr>
              <td style="padding:0 0 12px 0;text-align:center;">
                <span style="display:inline-block;font-size:20px;font-weight:700;color:#111827;letter-spacing:0.2px;">{{.Brand}}</span>
              </td>
            </tr>

            <tr>
              <td style="background-color:#ffffff;border:1px solid #e5e7eb;border-radius:14px;padding:28px 24px;">
                {{if .Title}}
                <h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.35;color:#111827;font-weight:700;">{{.Title}}</h1>
                {{end}}
                {{template "content" .}}
              </td>
            </tr>

            <tr>
              <td style="padding:14px 8px 0 8px;text-align:center;">
                <p style="margin:0 0 8px 0;font-size:12px;line-height:1.6;color:#6b7280;">此邮件由系统自动发送，请勿直接回复。</p>
                {{if .SupportEmail}}
                <p style="margin:0;font-size:12px;line-height:1.6;color:#9ca3af;">如需帮助，请联系：{{.SupportEmail}}</p>
                {{end}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
