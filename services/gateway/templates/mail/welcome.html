{{define "content"}}
<p style="margin:0 0 12px 0;font-size:15px;line-height:1.75;color:#374151;">你好，{{.Name}}：</p>
<p style="margin:0 0 12px 0;font-size:15px;line-height:1.75;color:#374151;">欢迎加入 {{.Brand}}，你的账号已创建成功。</p>
<p style="margin:0 0 20px 0;font-size:15px;line-height:1.75;color:#374151;">现在你可以开始创作、协作和管理内容了。</p>
{{if .ActionURL}}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px 0;">
	<tr>
		<td style="border-radius:10px;background-color:#2563eb;">
			<a href="{{.ActionURL}}" style="display:inline-block;padding:11px 20px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">{{if .ActionText}}{{.ActionText}}{{else}}立即开始{{end}}</a>
		</td>
	</tr>
</table>
{{end}}
<p style="margin:0;font-size:13px;line-height:1.7;color:#6b7280;">如果按钮无法点击，请复制链接到浏览器打开：{{.ActionURL}}</p>
{{end}}
