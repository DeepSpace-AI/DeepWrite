version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: .docker/web.Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_GATEWAY_BASE_URL=http://localhost:8080
    depends_on:
      - gateway

  gateway:
    build:
      context: .
      dockerfile: .docker/gateway.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - GATEWAY_MODE=release
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: .docker/worker.Dockerfile
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - redis

  postgres:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=deepwrite
      - POSTGRES_USER=deepwrite
      - POSTGRES_PASSWORD=deepwrite_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
