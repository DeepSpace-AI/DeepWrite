# DeepWrite Redis Configuration
# Optimized for development environment

# Network
bind 0.0.0.0
port 6379

# General
 daemonize no
 supervised no
 loglevel notice

# Persistence
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# Append Only File
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Connection
 timeout 0
tcp-keepalive 300

# Security (development - no password required for internal network)
# requirepass will be set via environment variable if needed

# Key eviction
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
