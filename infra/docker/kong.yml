_format_version: "3.0"
_transform: true

services:
  - name: user-service
    url: http://user-service:8081
    routes:
      - name: user-routes
        paths:
          - /api/users
          - /api/teams
          - /api/subscriptions
        strip_path: false

  - name: project-service
    url: http://project-service:8082
    routes:
      - name: project-routes
        paths:
          - /api/projects
        strip_path: false

  - name: reference-service
    url: http://reference-service:8083
    routes:
      - name: reference-routes
        paths:
          - /api/references
        strip_path: false

  - name: writing-service
    url: http://writing-service:8084
    routes:
      - name: writing-routes
        paths:
          - /api/documents
        strip_path: false

  - name: code-service
    url: http://code-service:8085
    routes:
      - name: code-routes
        paths:
          - /api/code
        strip_path: false

  - name: image-service
    url: http://image-service:8086
    routes:
      - name: image-routes
        paths:
          - /api/images
        strip_path: false

  - name: ai-service
    url: http://ai-service:8087
    routes:
      - name: ai-routes
        paths:
          - /api/ai
        strip_path: false

  - name: storage-service
    url: http://storage-service:8088
    routes:
      - name: storage-routes
        paths:
          - /api/storage
        strip_path: false

plugins:
  - name: rate-limiting
    config:
      minute: 100
      policy: redis
      redis_host: redis
      redis_port: 6379

  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "https://deepwrite.app"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - PATCH
      headers:
        - Authorization
        - Content-Type
        - X-Request-ID
      max_age: 3600
      credentials: true

  - name: request-transformer
    config:
      add:
        headers:
          - X-Forwarded-For:$client_ip

consumers:
  - username: internal-services
    keyauth_credentials:
      - key: ${INTERNAL_API_KEY:-internal-api-key-change-in-production}
