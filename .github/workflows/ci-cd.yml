name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - develop

env:
  GO_VERSION: '1.22'
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ==========================================
  # Go Services Tests
  # ==========================================
  test-go-services:
    name: Test Go Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, project-service, writing-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        continue-on-error: true
        run: |
          if [ -f "go.mod" ]; then
            go mod download
            go test -v -race -coverprofile=coverage.out ./... 2>&1 || echo "Tests failed but continuing"
          else
            echo "No go.mod found, skipping tests"
          fi

      - name: Upload coverage
        if: matrix.service == 'user-service'
        uses: codecov/codecov-action@v4
        with:
          files: services/${{ matrix.service }}/coverage.out
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage

  # ==========================================
  # Python Services Tests
  # ==========================================
  test-python-services:
    name: Test Python Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ai-service, reference-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
            pip install pytest pytest-cov httpx
          else
            echo "No requirements.txt found, skipping"
          fi

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -f "pytest.ini" ] || [ -d "tests" ]; then
            pytest -v --cov=. --cov-report=xml || true
          else
            echo "No tests found, skipping"
          fi

  # ==========================================
  # Frontend Tests & Build
  # ==========================================
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit || true

      - name: Build
        working-directory: frontend
        run: npm run build

  # ==========================================
  # Docker Build
  # ==========================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-go-services, test-python-services, test-frontend]
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [user-service, project-service, writing-service, ai-service, reference-service, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          push: false
          tags: deepwrite/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Security Scan
  # ==========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # Deploy to Production (Main Branch Only)
  # ==========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-docker, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://deepwrite.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here
          # Example: SSH to server and run docker-compose pull && docker-compose up -d
          # ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /opt/deepwrite && docker-compose pull && docker-compose up -d"

      - name: Health check
        run: |
          echo "Running health checks..."
          # curl -f https://deepwrite.app/health || exit 1

  # ==========================================
  # Deploy to Staging (Develop Branch)
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-docker, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.deepwrite.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # Add your staging deployment commands here

      - name: Health check
        run: |
          echo "Running staging health checks..."
          # curl -f https://staging.deepwrite.app/health || exit 1
