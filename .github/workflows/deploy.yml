name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "tag=${VERSION}" >> $GITHUB_OUTPUT
            echo "tags=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "tags=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/web.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/admin.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/admin:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/gateway.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/gateway:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/worker.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/worker:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/ai.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/ai:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/deepwrite' }}
            
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            export GITHUB_REPOSITORY=${{ github.repository }}
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export JWT_SECRET='${{ secrets.JWT_SECRET }}'
            export DB_USER='${{ secrets.DB_USER || 'deepwrite' }}'
            export DB_NAME='${{ secrets.DB_NAME || 'deepwrite' }}'
            
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Health check
        run: |
          echo "Deployment completed. Please verify services are running at:"
          echo "- Web: https://${{ secrets.DEPLOY_DOMAIN || 'your-domain.com' }}"
          echo "- Admin: https://${{ secrets.DEPLOY_DOMAIN || 'your-domain.com' }}/admin"
          echo "- API: https://${{ secrets.DEPLOY_DOMAIN || 'your-domain.com' }}/api"